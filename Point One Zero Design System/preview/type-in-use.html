<!doctype html>
<html><head><meta charset="utf-8">
<title>Type hierarchy in use</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px; background: #050517; color: #fff; }
  .eyebrow { color: rgba(255,255,255,.6); margin-bottom: 20px; }
  .h { font-family: var(--font-display); font-size: 68px; line-height:.95; letter-spacing: 0; text-transform: uppercase; margin: 0 0 16px; }
  .h em { font-style: normal; color: #009FF0; }
  .lede { font-family: var(--font-body); font-size: 17px; line-height: 1.5; letter-spacing: -0.01em; max-width: 520px; color: rgba(255,255,255,.85); margin: 0; }
  .lede strong em { color: #fff; font-style: italic; font-weight: 700; }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Hierarchy in use</div>
    <h1 class="h">strategy,<br>design, and<br>systems — <em>shipped.</em></h1>
    <p class="lede">an ai-native studio that builds products, reimagines experiences, and <strong><em>accelerates growth</em></strong>.</p>
  </div>
</body></html>
