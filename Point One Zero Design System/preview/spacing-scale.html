<!doctype html>
<html><head><meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .row-s { display: grid; grid-template-columns: 56px 1fr 40px; align-items: center; gap: 16px; padding: 6px 0; }
  .tok { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
  .bar { height: 12px; background: #009FF0; border-radius: 2px; }
  .v { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--fg-3); text-align: right; }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Spacing · multiples of 8</div>
    <div class="row-s"><div class="tok">--s-1</div><div class="bar" style="width:8px"></div><div class="v">8</div></div>
    <div class="row-s"><div class="tok">--s-2</div><div class="bar" style="width:16px"></div><div class="v">16</div></div>
    <div class="row-s"><div class="tok">--s-3</div><div class="bar" style="width:24px"></div><div class="v">24</div></div>
    <div class="row-s"><div class="tok">--s-4</div><div class="bar" style="width:32px"></div><div class="v">32</div></div>
    <div class="row-s"><div class="tok">--s-5</div><div class="bar" style="width:40px"></div><div class="v">40</div></div>
    <div class="row-s"><div class="tok">--s-6</div><div class="bar" style="width:48px"></div><div class="v">48</div></div>
    <div class="row-s"><div class="tok">--s-7</div><div class="bar" style="width:64px"></div><div class="v">64</div></div>
    <div class="row-s"><div class="tok">--s-8</div><div class="bar" style="width:80px"></div><div class="v">80</div></div>
    <div class="row-s"><div class="tok">--s-9</div><div class="bar" style="width:96px"></div><div class="v">96</div></div>
    <div class="row-s"><div class="tok">--s-10</div><div class="bar" style="width:128px"></div><div class="v">128</div></div>
  </div>
</body></html>
