<!doctype html>
<html><head><meta charset="utf-8">
<title>Radius & elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; background: #F6F6F6; }
  h4 { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-3); margin: 0 0 12px; }
  .row-r { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 22px; }
  .tile { width: 64px; height: 64px; background: #fff; border: 1px solid #D9D9D9; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
  .row-e { display: flex; gap: 20px; }
  .etile { width: 96px; height: 70px; background: #fff; border-radius: 4px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
</style></head>
<body>
  <div class="card">
    <h4>Corner radius</h4>
    <div class="row-r">
      <div class="tile" style="border-radius:0;">0</div>
      <div class="tile" style="border-radius:2px;">2</div>
      <div class="tile" style="border-radius:4px;">4</div>
      <div class="tile" style="border-radius:8px;">8</div>
      <div class="tile" style="border-radius:16px;">16</div>
      <div class="tile" style="border-radius:9999px;">pill</div>
    </div>
    <h4>Elevation</h4>
    <div class="row-e">
      <div class="etile" style="box-shadow:none;">0</div>
      <div class="etile" style="box-shadow:0 1px 2px rgba(5,5,23,.06);">1</div>
      <div class="etile" style="box-shadow:0 2px 8px rgba(5,5,23,.08);">2</div>
      <div class="etile" style="box-shadow:0 8px 24px rgba(5,5,23,.10);">3</div>
    </div>
  </div>
</body></html>
