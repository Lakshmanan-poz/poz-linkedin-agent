<!doctype html>
<html><head><meta charset="utf-8">
<title>Semantic color tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px 28px; }
  .pair {
    display: grid;
    grid-template-columns: 24px 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #F0F0F0;
    font-family: var(--font-body);
    font-size: 13px;
  }
  .pair:last-child { border-bottom: 0; }
  .chip { width: 24px; height: 24px; border-radius: 3px; border: 1px solid rgba(0,0,0,.06); }
  .tok { font-weight: 600; letter-spacing: -0.01em; }
  .val { font-family: var(--font-mono); font-size: 12px; color: var(--fg-2); }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Semantic Tokens</div>
    <div class="pair"><div class="chip" style="background:#050517;"></div><div class="tok">--fg-1 <span style="color:#888;font-weight:400;margin-left:6px;">· primary text</span></div><div class="val">poz-ink</div></div>
    <div class="pair"><div class="chip" style="background:#555562;"></div><div class="tok">--fg-2 <span style="color:#888;font-weight:400;margin-left:6px;">· secondary text</span></div><div class="val">n-500</div></div>
    <div class="pair"><div class="chip" style="background:#848492;"></div><div class="tok">--fg-3 <span style="color:#888;font-weight:400;margin-left:6px;">· tertiary / meta</span></div><div class="val">n-400</div></div>
    <div class="pair"><div class="chip" style="background:#009FF0;"></div><div class="tok">--fg-brand <span style="color:#888;font-weight:400;margin-left:6px;">· primary blue</span></div><div class="val">poz-blue</div></div>
    <div class="pair"><div class="chip" style="background:#0041E6;"></div><div class="tok">--fg-accent <span style="color:#888;font-weight:400;margin-left:6px;">· electric</span></div><div class="val">blue-electric</div></div>
    <div class="pair"><div class="chip" style="background:#FFFFFF;border:1px solid #ddd;"></div><div class="tok">--bg-1 <span style="color:#888;font-weight:400;margin-left:6px;">· canvas</span></div><div class="val">white</div></div>
    <div class="pair"><div class="chip" style="background:#F6F6F6;border:1px solid #ddd;"></div><div class="tok">--bg-2 <span style="color:#888;font-weight:400;margin-left:6px;">· subtle surface</span></div><div class="val">n-50</div></div>
    <div class="pair"><div class="chip" style="background:#D9D9D9;"></div><div class="tok">--border-1 <span style="color:#888;font-weight:400;margin-left:6px;">· default border</span></div><div class="val">n-200</div></div>
  </div>
</body></html>
