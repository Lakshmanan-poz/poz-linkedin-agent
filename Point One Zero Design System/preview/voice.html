<!doctype html>
<html><head><meta charset="utf-8">
<title>Voice samples</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; background: #050517; color: #fff; }
  .eyebrow { color: rgba(255,255,255,.6); }
  .line { font-family: var(--font-display); font-size: 34px; line-height: 1; text-transform: uppercase; letter-spacing: 0; margin-bottom: 14px; }
  .line em { font-style: normal; color: #009FF0; }
  .rule { font-family: var(--font-body); font-size: 13px; color: rgba(255,255,255,.7); letter-spacing: -0.01em; margin: 0; }
  .rule b em { color: #fff; font-style: italic; }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Voice · minimal, confident, premium</div>
    <div class="line">your vision.<br>our <em>mission</em>.</div>
    <p class="rule">keep text per slide: <strong><em>6–10 words</em></strong>. bullets start lowercase. emphasis is <strong><em>bold italic</em></strong>, used sparingly. never corporate, never cute.</p>
  </div>
</body></html>
