<!doctype html>
<html><head><meta charset="utf-8">
<title>Logo marks</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .cell { aspect-ratio: 5/3; display: flex; align-items: center; justify-content: center; }
  .light { background: #fff; border-right: 1px solid #eee; }
  .dark { background: #050517; }
  .brand { background: #009FF0; }
  .inv { background: #fff; border-top: 1px solid #eee; border-right: 1px solid #eee; }
  img { max-width: 35%; max-height: 60%; }
</style></head>
<body>
  <div class="card">
    <div class="cell light"><img src="../assets/logo-mark-black.png" alt=""></div>
    <div class="cell dark"><img src="../assets/logo-mark-white.png" alt=""></div>
    <div class="cell inv"><img src="../assets/wordmark-black.png" alt="" style="max-width:55%;"></div>
    <div class="cell brand"><img src="../assets/logo-mark-white.png" alt=""></div>
  </div>
</body></html>
