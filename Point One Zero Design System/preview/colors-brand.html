<!doctype html>
<html><head><meta charset="utf-8">
<title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 0; }
  .hero-row { display: grid; grid-template-columns: 1fr 1fr; }
  .big {
    aspect-ratio: 5/3;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: #fff;
  }
  .big .label { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; opacity: .8; }
  .big .hex { font-family: var(--font-display); font-size: 44px; line-height: 1; letter-spacing: 0.01em; }
  .blue { background: #009FF0; }
  .electric { background: #0041E6; }
  .ink-row { display: grid; grid-template-columns: 1fr 1fr; }
  .ink { background: #050517; color: #fff; }
  .white { background: #fff; color: #050517; border-top: 1px solid #eee; }
  .white .label { opacity: .6; }
</style></head>
<body>
  <div class="card">
    <div class="hero-row">
      <div class="big blue"><div class="label">Primary · Blue</div><div class="hex">#009FF0</div></div>
      <div class="big electric"><div class="label">Accent · Electric</div><div class="hex">#0041E6</div></div>
    </div>
    <div class="ink-row">
      <div class="big ink"><div class="label">Ink</div><div class="hex">#050517</div></div>
      <div class="big white"><div class="label">Canvas</div><div class="hex">#FFFFFF</div></div>
    </div>
  </div>
</body></html>
