<!doctype html>
<html><head><meta charset="utf-8">
<title>Nav bar</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body, html { background: #F6F6F6; }
  .card { padding: 24px; background: #F6F6F6; }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px;
    background: #fff;
    border: 1px solid #EEEEEE;
    border-radius: 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 24px; height: 24px; }
  .brand span { font-family: var(--font-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
  .links { display: flex; gap: 28px; }
  .links a { font-family: var(--font-body); font-size: 13px; color: #050517; text-decoration: none; font-weight: 500; letter-spacing: -0.01em; }
  .links a.active { color: #009FF0; }
  .cta {
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    background: #050517; color: #fff; padding: 10px 16px; border-radius: 4px; border: 0;
  }
</style></head>
<body>
  <div class="card">
    <div class="nav">
      <div class="brand">
        <img src="../assets/logo-mark-black.png" alt="">
        <span>point one zero</span>
      </div>
      <div class="links">
        <a href="#" class="active">work</a>
        <a href="#">services</a>
        <a href="#">studio</a>
        <a href="#">journal</a>
      </div>
      <button class="cta">start a project →</button>
    </div>
  </div>
</body></html>
