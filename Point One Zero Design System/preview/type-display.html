<!doctype html>
<html><head><meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; }
  .spec { display: flex; align-items: baseline; gap: 24px; padding: 10px 0; }
  .meta { font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--fg-3); text-transform: uppercase; width: 88px; flex-shrink:0; }
  .sample { font-family: var(--font-display); line-height: 1; letter-spacing: 0; color: var(--fg-1); }
</style></head>
<body>
  <div class="card">
    <div class="eyebrow">Display · Bebas Neue</div>
    <div class="spec"><div class="meta">D1 · 185</div><div class="sample" style="font-size:96px;">POINT ONE ZERO</div></div>
    <div class="spec"><div class="meta">D2 · 144</div><div class="sample" style="font-size:72px;">STRATEGY, SHIPPED.</div></div>
    <div class="spec"><div class="meta">H1 · 120</div><div class="sample" style="font-size:56px;">ACCELERATE GROWTH</div></div>
    <div class="spec"><div class="meta">H2 · 100</div><div class="sample" style="font-size:40px;letter-spacing:.02em;">REIMAGINE EXPERIENCES</div></div>
  </div>
</body></html>
